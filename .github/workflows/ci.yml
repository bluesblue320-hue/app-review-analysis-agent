name: CI

on:
  push:
    branches: [main, agent/**]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    env:
      PYTHON_VERSION: "3.12"
      COVERAGE_FAIL_UNDER: "70"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: |
          python -m ruff check .
          python -m ruff format --check .

      - name: Compile check
        run: python -m compileall -q backend frontend evaluation tests

      - name: Application import check
        run: python -c "from backend.main import app; print('app import ok')"

      - name: Test collection
        run: python -m pytest --collect-only -q

      - name: Full pytest with coverage
        run: |
          python -m pytest --cov=. --cov-report=term-missing --cov-report=xml \
            --cov-fail-under="${{ env.COVERAGE_FAIL_UNDER }}"

      - name: Mock Agent evaluation (Direct baseline)
        run: python -m evaluation.evaluate_agent --mode mock --fail-under

      - name: Whitespace check
        run: git diff --check
