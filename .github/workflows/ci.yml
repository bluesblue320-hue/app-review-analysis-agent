name: CI

on:
  push:
    branches: [main, agent/**]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    env:
      PYTHON_VERSION: "3.12"
      COVERAGE_FAIL_UNDER: "80"
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d app_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,langchain]"
          pip install psycopg2-binary redis

      - name: Lint
        run: |
          python -m ruff check .
          python -m ruff format --check .

      - name: Compile check
        run: python -m compileall -q backend evaluation tests

      - name: Application import check
        run: python -c "from backend.main import app; print('app import ok')"

      - name: Test collection
        run: python -m pytest --collect-only -q

      - name: Full pytest with coverage (SQLite)
        run: |
          python -m pytest --cov=. --cov-report=term-missing --cov-report=xml \
            --cov-fail-under="${{ env.COVERAGE_FAIL_UNDER }}"

      - name: Alembic migration against empty PostgreSQL
        run: |
          DATABASE_URL="postgresql+psycopg2://app:app@localhost:5432/app_test" \
            python -m alembic upgrade head

      - name: PostgreSQL migration downgrade/upgrade roundtrip
        run: |
          DATABASE_URL="postgresql+psycopg2://app:app@localhost:5432/app_test" \
            python -m alembic downgrade base
          DATABASE_URL="postgresql+psycopg2://app:app@localhost:5432/app_test" \
            python -m alembic upgrade head

      - name: PostgreSQL persistence integration smoke
        run: |
          DATABASE_URL="postgresql+psycopg2://app:app@localhost:5432/app_test" \
            python -m pytest tests/test_sqlalchemy_persistence.py -q

      - name: Redis cache + short lock integration smoke
        run: |
          REDIS_URL="redis://localhost:6379/0" \
            python -m pytest tests/test_redis_cache_integration.py tests/test_cache_service.py -q

      - name: Mock Agent evaluation (Direct)
        run: python -m evaluation.evaluate_agent --mode mock --adapter direct --fail-under

      - name: Mock Agent evaluation (LangChain)
        run: python -m evaluation.evaluate_agent --mode mock --adapter langchain --fail-under

      - name: Ready endpoint smoke
        run: |
          APP_ENV=test python -c "
          from fastapi.testclient import TestClient
          from backend.main import app
          client = TestClient(app)
          r = client.get('/api/v1/ready')
          print('ready status:', r.status_code)
          assert r.status_code in (200, 503)
          "

      - name: Whitespace check
        run: git diff --check

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Production build
        run: npm run build

      - name: Check browser bundle for server-only secret wiring
        run: |
          if grep -R -n -E 'VITE_(APP_ACCESS_TOKEN|DEEPSEEK_API_KEY)|Bearer[[:space:]]+\$\{APP_ACCESS_TOKEN\}' dist; then
            echo "Server-only secret wiring found in browser bundle."
            exit 1
          fi

  docker-build:
    runs-on: ubuntu-latest
    env:
      APP_ACCESS_TOKEN: ci-compose-validation-token
    steps:
      - uses: actions/checkout@v4

      - name: Build FastAPI production image
        run: docker build -f Dockerfile.api -t app-review-api:test .

      - name: Build React/Nginx production image
        run: docker build -f Dockerfile.web -t app-review-web:test .

      - name: Validate Docker Compose configuration
        run: docker compose config --quiet
