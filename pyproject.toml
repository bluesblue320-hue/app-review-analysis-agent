[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "app-review-analysis-agent"
version = "1.0.0"
description = "App review analysis agent with deterministic tools, dual model adapters, PostgreSQL and Redis"
requires-python = ">=3.12"
dependencies = [
    "streamlit==1.32.0",
    "pandas==2.2.1",
    "jieba==0.42.1",
    "scikit-learn==1.4.1.post1",
    "snownlp==0.12.3",
    "requests==2.32.3",
    "pyecharts==2.0.6",
    "fastapi==0.140.7",
    "uvicorn==0.51.0",
    "pydantic==2.13.4",
    "python-multipart==0.0.32",
    "httpx>=0.27,<1",
    "sqlalchemy==2.0.51",
    "alembic==1.19.0",
    "redis>=5,<9",
    "openai>=1.40,<3",
]

[project.optional-dependencies]
langchain = [
    "langchain-core==0.3.60",
    "langchain-deepseek==0.1.4",
    "langchain-openai==0.3.0",
    "langsmith==0.1.147",
]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.16.1",
    "psycopg2-binary>=2.9,<3",
    "redis>=5,<9",
]

[tool.setuptools]
py-modules = []

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["."]
omit = [
    ".venv/*",
    ".git/*",
    "tests/*",
    "evaluation/*",
    "frontend/*",
    "__pycache__/*",
    ".pytest_cache/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = [".venv", "docs", "evaluation/reports", "__pycache__"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "UP",
    "B",
    "SIM",
]
ignore = [
    "E501",
    "SIM108",
    "SIM117",
    "B008",
]
